slug: porta-raspando-no-piso
titulo: Porta raspando no piso
categoria: corredor
resumo: Ajuste as dobradiças para impedir que a porta arraste ao abrir e fechar.
dificuldade: medio
tempo_min: 20
tags: [porta, carpintaria, dobradica, ajuste]
sinonimos: [porta arrastando, porta emperrada no chao]
sintomas: [porta faz barulho ou agarra no piso ao abrir]
perguntas_triagem:
  - A porta arrasta em toda a extensão ou apenas em um ponto?
  - Os parafusos da dobradiça estão frouxos?
avisos:
  - Não retire portas pesadas sem auxílio de outra pessoa.
materiais: [Chave de fenda ou parafusadeira, Cunhas de madeira, Parafusos novos]
passos:
  - titulo: Inspecione as dobradiças
    texto: |
      Abra a porta e verifique se há parafusos soltos nas dobradiças superior e inferior.
  - titulo: Aperte os parafusos
    texto: |
      Aperte firmemente os parafusos para realinhar a folga da folha da porta.
  - titulo: Utilize cunhas se necessário
    texto: |
      Apoie a porta com cunhas ao realizar ajustes finos para que ela não ceda.
