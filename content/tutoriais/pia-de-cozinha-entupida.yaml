slug: pia-de-cozinha-entupida
titulo: Pia de cozinha entupida
categoria: banheiro
resumo: Limpe o sifão acumulado para reestabelecer o escoamento da pia da cozinha.
dificuldade: facil
tempo_min: 25
tags: [pia, cozinha, entupimento, sifao]
sinonimos: [pia entupida, ralo da cozinha cheio]
sintomas: [agua nao desce na pia da cozinha]
perguntas_triagem:
  - A água parou de descer completamente ou está lenta?
  - Há refluxo de água quando usa a pia?
avisos:
  - Coloque um balde embaixo do sifão antes de abri-lo para reter a água acumulada.
materiais: [Balde, Luvas, Chave inglesa ou alicate, Pano, Água quente, Detergente]
passos:
  - titulo: Posicione o balde
    texto: |
      Coloque o balde diretamente embaixo do sifão em formato de U.
  - titulo: Desmonte o sifão
    texto: |
      Desrosqueie as conexões manuais do sifão, esvazie o conteúdo no balde e limpe o interior.
  - titulo: Remonte e teste
    texto: |
      Recoloque o sifão garantindo o aperto correto das roscas e despeje água quente com detergente.
